services:
  - type: web
    name: ghostgroove-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BACKEND_CORS_ORIGINS
        value: https://ghostgroove.com,https://www.ghostgroove.com
